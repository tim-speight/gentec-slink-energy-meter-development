# Stream Device Protocol for the Gentec S-Link Power & Energy Monitor. Revised from Pete Owens

terminator   = CR LF;
replytimeout = 1000;
readtimeout  = 1500;

# commands related to the box
reset         { out "*RST";         }
get_version   { out "*VER";         in "%39c"; }

# commands related to channel
get_name      { out "*NA\$1";       in "%39c"; }
get_serial    { out "*SN\$1";       in "%39c"; }
get_status    { out "*ST\$1";       in ":00000%(\$2:\$3:Wavelength.VAL)4x";
                                    in ":00001%(\$2:\$3:Scale.VAL)4x";
                                    in ":00002%(\$2:\$3:TrigLev.RVAL)4x";
                                    in ":00003%*4x";
                                    in ":00004000%(\$2:\$3:Attenuator.VAL){0|1}";
                                    in ":00005000%(\$2:\$3:ExtTrig.VAL){0|1}";
                                    in ":00006000%(\$2:\$3:Anticipation.VAL){0|1}";
                                    in ":00007000%(\$2:\$3:EnergyMode.VAL){0|1}";
                                    in ":100000000";}

set_en_mode   { out "*EM\$1%{0|1}"; }
set_atten     { out "*AT\$1%{0|1}"; }
set_antic     { out "*AN\$1%{0|1}"; }
set_wavelen   { out "*PW\$1%05d";   }
set_triglev   { out "*TL\$1%04.1f"; }
set_exttrig   { out "*ET\$1%{0|1}"; }
set_scale     { out "*SC\$1%02d";   }
scale_up      { out "*SU\$1";       }
scale_down    { out "*SD\$1";       }

# commands for acquiring data
# Streaming mode (manual p.31): ASCII all points (*SS$1001), polling mode
# off (*VNP, global, the power-up default) so *CA$1 pushes one line per
# laser pulse (energy head) or at 100 Hz (power head). Read by get_value_con.
start_acq   { wait 100;
              out "*SS\$1001";
              out "*VNP";
              out "*CA\$1";
            }

# *VNP/*VNM are global (no channel digit, manual p.34). Sending *VNP here
# would stop *CV polling on the other head, so stop is per channel only.
stop_acq    { wait 100;
              out "*CS\$1";
}
# Polled single value (*VNM mode only). Not used by the IOC in streaming
# mode; kept for diagnostics.
get_value   { replytimeout = 250; readtimeout = 100;
              out "*CV\$1";       in "\$1:%g";  }

send_trigger  { out "*CV\$1"; }

# Streaming data path (I/O Intr): one line per pulse, "1:8.808e-07".
# Each head matches only its own channel prefix; the other head's lines
# are ignored. Short pollperiod keeps the port responsive to control writes.
get_value_con { pollperiod = 100; readtimeout = 100;
                in "\$1:%g";  }

get_range   { out "*RG\$1";       in ":00000%4x";
                                  in ":00001%(\$2:\$3:MaxRange.VAL)4x";
                                  in ":100000000";}
probeConnection  { out "*NA\$1";       in "%39c"; }
